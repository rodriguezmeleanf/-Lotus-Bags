<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lotus Bags</title>
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f5f5f5;
      text-align:center;
    }

    .hero{
      background:black;
      color:gold;
      padding:60px 20px;
    }

    .hero img{
      width:250px;
      max-width:90%;
      border-radius:12px;
    }

    h1{
      font-size:48px;
      margin-top:20px;
    }

    .btn{
      display:inline-block;
      margin-top:25px;
      padding:14px 30px;
      border:1px solid white;
      color:white;
      text-decoration:none;
      border-radius:6px;
    }

    .section{
      padding:40px 20px;
    }

    .products img{
      width:280px;
      border-radius:15px;
      margin:15px;
    }
  </style>
</head>
<body>

  <section class="hero">
    <img src="About Lotus Bags - Home.png">
    <h1>LOTUS BAGS</h1>
    <a class="btn" href="#">SHOP NOW</a>
  </section>

  <section class="section">
    <h2>Nuestra colección</h2>

    <div class="products">
      <img src="About Lotus Bags - About Us.png">
      <img src="About Lotus Bags - Our Products.png">
      <img src="About Lotus Bags - Let's Connect.png">
    </div>
  </section>

</body>
</html>
