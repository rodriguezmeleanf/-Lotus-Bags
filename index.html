<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="css/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lotus Bags</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Helvetica, Arial, sans-serif;
}

body{
background:white;
color:black;
}

/* MENU */

header{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:30px 60px;
z-index:1000;
background:white;
}

.logo{
font-size:30px;
letter-spacing:6px;
font-weight:500;
}

nav a{
margin-left:30px;
text-decoration:none;
color:black;
font-size:13px;
letter-spacing:2px;
}

/* HERO */

.hero-new{
display:flex;
align-items:center;
justify-content:space-between;
background:#f5efe7;
padding:120px 80px;
gap:40px;
}

.hero-text{
width:45%;
}

.hero-text h4{
letter-spacing:4px;
font-size:18px;
margin-bottom:20px;
color:#b68b4c;
}

.hero-text h1{
font-size:80px;
line-height:1;
margin-bottom:30px;
font-family:serif;
}

.hero-text p{
font-size:22px;
line-height:1.5;
margin-bottom:40px;
}

.whatsapp-btn{
background:black;
color:white;
padding:18px 40px;
text-decoration:none;
font-size:18px;
letter-spacing:2px;
display:inline-block;
border-radius:4px;
}

.hero-image{
width:55%;
}

.hero-image img{
width:100%;
border-radius:8px;
}
text-align:center;
background:rgba(0,0,0,0.2);
padding:50px;
}

.overlay h1{
color:white;
font-size:80px;
font-weight:300;
letter-spacing:12px;
}

.overlay p{
margin-top:20px;
color:white;
letter-spacing:4px;
font-size:18px;
}

.btn{
display:inline-block;
margin-top:30px;
padding:16px 45px;
background:white;
color:black;
text-decoration:none;
font-size:13px;
letter-spacing:3px;
transition:0.3s;
}

.btn:hover{
background:black;
color:white;
}

/* SECTION */

.section{
padding:120px 8%;
}

.title{
text-align:center;
font-size:40px;
letter-spacing:6px;
margin-bottom:70px;
font-weight:300;
}

/* PRODUCTS */

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
gap:40px;
}

.product img{
width:100%;
height:550px;
object-fit:cover;
}

.product h3{
margin-top:20px;
font-size:18px;
letter-spacing:2px;
font-weight:400;
}

.product p{
margin-top:10px;
color:#777;
}

/* FULL IMAGE */

.banner{
margin-top:100px;
height:700px;
background:url('About Lotus Bags - Our Products.png') center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
}

.banner h2{
color:white;
font-size:60px;
letter-spacing:10px;
font-weight:300;
}

/* FOOTER */

footer{
padding:80px;
text-align:center;
margin-top:80px;
border-top:1px solid #eee;
}

footer p{
color:#888;
letter-spacing:3px;
font-size:12px;
}

/* MOBILE */

@media(max-width:768px){

header{
padding:20px;
}

.logo{
font-size:20px;
}

nav a{
margin-left:12px;
font-size:11px;
}

.overlay h1{
font-size:45px;
}

.banner h2{
font-size:35px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">
LOTUS BAGS
</div>

<nav>
<a href="#">HOME</a>
<a href="#">SHOP</a>
<a href="#">ABOUT</a>
<a href="#">CONTACT</a>
</nav>

</header>

<<section class="hero-new">

<div class="hero-text">

<h4>LOTUS MCBO BAGS</h4>

<h1>Tu sello,<br>tu estilo.</h1>

<p>
Diseños que te acompañan y realzan tu esencia.
</p>

<a href="https://wa.me/584121270974" class="whatsapp-btn" target="_blank">
WHATSAPP
</a>

</div>

<div class="hero-image">

<img src="About Lotus Bags - Home.png">

</div>

</section>
<div class="product">
<img src="About Lotus Bags - Our Products.png">
<h3>Best Seller</h3>
<p>125.99$</p>

<a href="https://wa.me/584121270974" target="_blank">
<button>Comprar</button>
</a>

</div>

<div class="product">
<img src="About Lotus Bags - Let's Connect.png">
<h3>Elegant Edition</h3>
<p>139.99$</p>

<a href="https://wa.me/584121270974" target="_blank">
<button>Comprar</button>
</a>

</div>

</div>
</section>

<section class="banner">

<h2>
LUXURY EVERYDAY
</h2>

</section>

<footer>

<p>
LOTUS BAGS © 2026
</p>

</footer>

</body>
</html>
